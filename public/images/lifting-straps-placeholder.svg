      <stop offset="0%" stop-color="#15181d"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>
    <pattern id="stripes2" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="28" height="28" fill="none"/>
      <rect width="10" height="28" fill="#ffffff" fill-opacity="0.03"/>
