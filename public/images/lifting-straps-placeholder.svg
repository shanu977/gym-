  <text x="450" y="187" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0b0d10" letter-spacing="3">TEMPORARY PLACEHOLDER</text>

  <text x="450" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#f2efe6">CANVAS</text>
  <text x="450" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" fill="#f2efe6">LIFTING STRAPS</text>

  <line x1="330" y1="530" x2="570" y2="530" stroke="#c9a227" stroke-width="3"/>
  <text x="450" y="580" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#b9b4a6">Form Athletics · Accessories</text>

